# Tests, build, puis envoi sur o2switch (shoptonchargeur.bsandoz.fr ; l'ancienne adresse choptonchargeur.bsandoz.fr pointe sur le même dossier et redirige) en FTPS avec lftp.
# Même méthode que le déploiement de Perfect Clean (bsandoz-booking), éprouvée chez o2switch.
# À régler dans GitHub → Settings → Secrets and variables → Actions :
#   secrets   FTP_USERNAME, FTP_PASSWORD : compte FTP limité au dossier du sous-domaine (ex. chargeur@bsandoz.fr)
#   secret    FTP_SERVER (facultatif)    : nom du serveur couvert par le certificat, muguet.o2switch.net par défaut
#   secret    FTP_DIR (facultatif)       : dossier d'envoi vu par ce compte, sa racine par défaut
#   variable  VITE_AMAZON_TAG            : identifiant Partenaires Amazon (facultatif)
name: Déploiement o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_AMAZON_TAG: ${{ vars.VITE_AMAZON_TAG }}

      - name: Envoi FTPS vers o2switch
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          # Secrets absents : échec clair (le site ne serait pas mis en ligne).
          manquants=""
          [ -n "$FTP_USERNAME" ] || manquants="$manquants FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || manquants="$manquants FTP_PASSWORD"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets GitHub manquants :$manquants (Settings → Secrets and variables → Actions → onglet Secrets)."
            exit 1
          fi
          # Espaces et retours à la ligne collés par erreur dans les secrets.
          FTP_SERVER=$(printf '%s' "${FTP_SERVER:-muguet.o2switch.net}" | tr -d '[:space:]')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          FTP_DIR=$(printf '%s' "${FTP_DIR:-.}" | tr -d '[:space:]')
          echo "Serveur : $FTP_SERVER · compte : $FTP_USERNAME · dossier : $FTP_DIR"
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # Intermédiaires Let's Encrypt absents côté serveur : chaîne reconstituée, certificat toujours vérifié.
          # TLS 1.2 : en TLS 1.3, lftp (gnutls) échoue sur le canal de données (« gnutls_record_recv: Error in parsing »).
          # Tout sauf les pages HTML d'abord, puis le reste : la page ne pointe jamais vers un fichier pas encore envoyé.
          sh .github/chaine-ftps.sh "$FTP_SERVER" "$RUNNER_TEMP/chaine-ftps.pem"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:ca-file $RUNNER_TEMP/chaine-ftps.pem; set ssl:priority NORMAL:-VERS-TLS1.3; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            set net:max-retries 3; set net:reconnect-interval-base 5; set net:timeout 30;
            mirror --reverse --no-perms --parallel=4 --verbose=1 --exclude-glob *.html dist/ $FTP_DIR;
            mirror --reverse --no-perms --parallel=4 --verbose=1 dist/ $FTP_DIR;
            echo '--- Contenu du dossier en ligne :'; cls -1 $FTP_DIR;
            bye"
